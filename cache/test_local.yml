kind: source
spec:
  name: test-mock
  path: /home/ubuntu/cloudquery/cache/cq-source-test
  registry: local
  tables: ["*"]
  destinations: ["postgresql"]
---
kind: destination
spec:
  name: postgresql
  path: /home/ubuntu/cloudquery/cache/cq-destination-postgresql
  registry: local
  write_mode: "overwrite-delete-stale"
  spec:
    connection_string: "postgresql://cq_admin:MySecretCQPassword123!@127.0.0.1:5435/cloudquery?sslmode=disable"
