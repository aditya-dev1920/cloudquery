kind: source
spec:
  name: aws-internal
  path: "${CQ_CACHE_DIR}/cq-source-aws"
  registry: local
  tables: ["*"]
  skip_tables:
    - "aws_cloudtrail_events"
    - "aws_s3_bucket_objects"
  destinations: ["postgresql"]
  spec:
    # Regions to scan: Use ["*"] to crawl all enabled regions, or specify e.g. ["ap-south-1", "us-east-1"]
    regions: ["*"]