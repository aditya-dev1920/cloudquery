version: '3.8'

# This docker-compose file is used to run a dedicated PostgreSQL database for CloudQuery.
services:
  postgres:
    image: postgres:16-alpine
    container_name: cq-postgres-engine
    restart: always
    environment:
      POSTGRES_DB: cloudquery
      POSTGRES_USER: cq_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MySecretCQPassword123!}
    volumes:
      - cq_dedicated_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432" 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cq_admin -d cloudquery"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cq_isolated_network

# This network is used to isolate the PostgreSQL service from other services in the docker-compose environment.
networks:
  cq_isolated_network:
    driver: bridge

# This volume is used to persist PostgreSQL data across container restarts and recreations.
volumes:
  cq_dedicated_pgdata: